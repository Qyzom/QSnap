<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QSnap Icon</title>
  <style>
    @font-face {
      font-family: 'Unbounded';
      src: url('../ui/fonts/Unbounded.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 512px;
      height: 512px;
    }

    .icon-container {
      width: 480px;
      height: 480px;
      background: #0A0A0C;
      border: 2px solid #27272A;
      border-radius: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      box-sizing: border-box;
    }

    .letter {
      font-family: 'Unbounded', sans-serif;
      font-size: 290px;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1;
      user-select: none;
      transform: translateY(-8px);
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <span class="letter">Q</span>
  </div>
</body>
</html>
