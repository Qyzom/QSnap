[package]
name = "qsnap"
version = "0.1.0"
edition = "2021"
authors = ["Qyzom <t0lotsmail@gmail.com>"]
description = "High-performance split-screen video clipper, viral template editor & anti-fraud uniqueizer in Rust"
license = "MIT"
repository = "https://github.com/Qyzom/QSnap"

[dependencies]
# GUI
slint = { version = "1.9", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }
i-slint-backend-winit = { version = "1.9", default-features = false }

# Async runtime & Utilities
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "2.0"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
fastrand = "2.3"
tempfile = "3"
rfd = "0.15"

# Logging
log = "0.4"
env_logger = "0.11"

# Image & Icon handling
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
